[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pest-classifier"
version = "0.1.0"
description = "EfficientNet-V2-S classification pipeline for the IP102 insect pest dataset"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Szymon Kwiatkowski"}]
dependencies = [
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "numpy>=1.26",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
pest-train = "pest_classifier.train:main"
pest-evaluate = "pest_classifier.evaluate:main"
pest-predict = "pest_classifier.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
